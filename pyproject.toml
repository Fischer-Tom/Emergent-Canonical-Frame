[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "emergent-canonical-frame"
version = "0.1.0"
description = "Research code for emergent canonical object frames."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tom Fischer" }
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
    "opencv-python-headless",
    "hydra-core",
    "omegaconf",
    "tqdm",
    "rich",
    "einops",
    "scikit-learn",
    "h5py",
    "pandas",
    "plotly",
    "huggingface-hub",
    "fvcore",
    "iopath",
    "poselib",
    "torch",
    "torchvision",
    "healpy",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 88
target-version = "py310"


[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]